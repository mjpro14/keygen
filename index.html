<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Key Generator - FRP Portal</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

    <div class="card">
        <h2>Key Generator</h2>

        <p class="subtitle">
            FRP Portal Activation Admin
        </p>

        <label for="macInput">
            User Device ID / MAC Address:
        </label>

        <input
            type="text"
            id="macInput"
            placeholder="e.g. 240AC456789A"
            autocomplete="off"
        >

        <button onclick="generateKey()">
            GENERATE KEY
        </button>

        <div class="result-box" id="resultArea">
            <label>Activation Key:</label>

            <div class="key-display" id="generatedKey">
                ---
            </div>

            <button class="copy-btn" onclick="copyKey()">
                Copy Key
            </button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
