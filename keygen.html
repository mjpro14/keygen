<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Key Generator - FRP Portal</title>
    <!-- Gagamit ng CryptoJS para sa MD5 Hashing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
        }
        label {
            font-size: 14px;
            color: #94a3b8;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            text-transform: uppercase;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background-color: #10b981;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #059669;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px dashed #38bdf8;
            text-align: center;
        }
        .key-display {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 2px;
            margin-top: 5px;
            word-break: break-all;
        }
        .copy-btn {
            background-color: #3b82f6;
            margin-top: 10px;
            padding: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Key Generator</h2>
    <p style="font-size: 12px; color: #94a3b8; text-align: center;">FRP Portal Activation Admin</p>
    
    <label for="macInput">User Device ID / MAC Address:</label>
    <input type="text" id="macInput" placeholder="e.g. 240AC456789A" autocomplete="off">

    <button onclick="generateKey()">GENERATE KEY</button>

    <div class="result-box" id="resultArea" style="display: none;">
        <label style="margin:0;">Activation Key:</label>
        <div class="key-display" id="generatedKey">---</div>
        <button class="copy-btn" onclick="copyKey()">Copy Key</button>
    </div>
</div>

<script>
    // MAHALAGA: Dapat EKSATONG TAMA ito sa SECRET_SALT na nasa ESP32 Code mo!
    const SECRET_SALT = "MJDEV";

    function generateKey() {
        let mac = document.getElementById("macInput").value.trim().toUpperCase();
        
        // Tanggalin ang colons 🙂) kung sakaling naisama ng user sa pag-copy
        mac = mac.replace(/:/g, "");

        if (mac === "") {
            alert("Pakilagay ang MAC Address / Device ID ng user!");
            return;
        }

        // I-compute ang MD5 Hash ng (MAC + SECRET_SALT)
        let combinedString = mac + SECRET_SALT;
        let hash = CryptoJS.MD5(combinedString).toString().toUpperCase();

        // Kunin ang unang 10 characters (katulad ng nasa ESP32 firmware)
        let finalKey = hash.substring(0, 10);

        // Ipakita ang Resulta
        document.getElementById("generatedKey").innerText = finalKey;
        document.getElementById("resultArea").style.display = "block";
    }

    function copyKey() {
        let keyText = document.getElementById("generatedKey").innerText;
        navigator.clipboard.writeText(keyText);
        alert("Na-copy na ang Key: " + keyText);
    }
</script>

</body>
</html>
